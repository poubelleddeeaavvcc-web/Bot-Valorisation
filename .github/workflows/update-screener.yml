name: Mise a jour du screener (cache + analyse + simulation)

on:
  schedule:
    - cron: "35 * * * *"  # toutes les heures -- plus de plancher d'1h impose par une plateforme cloud ici
  workflow_dispatch: {}      # bouton "Run workflow" manuel dans l'onglet Actions

permissions:
  contents: write  # necessaire pour que les jobs puissent commit+push leurs resultats

concurrency:
  group: screener-update
  cancel-in-progress: false  # ne jamais interrompre un run en cours (perdrait le progres du cache)

# Restructure en jobs paralleles le 2026-09-08 (etait un seul job sequentiel de 24 etapes,
# ~13 min) : le cache fondamentaux + notes tourne une fois dans `setup`, puis les jobs de
# simulation tournent en parallele une fois `setup` termine et pousse. Les bots Ollama
# ("newsgated", #4/5/6/13-18/22-24) restent regroupes dans UN SEUL job (bots-ollama) plutot que
# repartis sur plusieurs : ils partagent des caches JSON (news_verdict_cache.json,
# customer_concentration_cache.json -- voir news_filter.py) que des jobs paralleles ecrivant
# chacun leur propre copie rendrait incoherents au moment du commit (meme classe de probleme
# que la collision vecue avec newsletter-digest-bot le meme jour). Les autres bots (sans
# Ollama) n'ont aucun fichier de sortie partage entre eux -- chacun ecrit ses propres
# results/simulation/*.csv/json -- donc repartis sans risque sur un job par strategie de
# capital (bots-aveugle/bots-contraint/bots-large/bots-delta, ce dernier ajoute 2026-09-10
# pour le Bot #25).
# BOTS FIGES (2026-10-20, demande de l'utilisateur) : 26 variantes du screener ne tournent plus --
# A9, B2-B10, C2-C10, D3, D5-D10. Leurs scripts et leur historique restent dans le depot (les
# relancer = remettre leur etape ici). Ils etaient correles a ~0,76 entre eux et ne detenaient
# que des sous-ensembles du panier de A1 : restent A1-A8 (chaque filtre, sans capital), B1, C1,
# D1 (un bot executable par famille) et D2/D4 (Delta + notes, a confirmer).
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Rafraichir le momentum sectoriel et l'univers de tendance
        run: python screener/build_trending_universe.py

      - name: Avancer le cache de fondamentaux (respecte le rate-limit Yahoo)
        run: python screener/fetch_cache.py

      - name: Analyser le cache (aucun appel reseau)
        run: python screener/analyze_cache.py

      - name: Calculer les notes Qualite/Perspective (affichage + Bot #7/#8/#9, aucun appel reseau)
        run: python screener/quality_perspective_notes.py

      - name: Commit + push si des resultats ont change
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/universe/ results/screener/fundamentals_cache.csv \
                  results/screener/full_valuation_latest.csv results/screener/long_candidates_latest.csv \
                  results/screener/quality_perspective_notes.csv
          if git diff --cached --quiet; then
            echo "Rien de nouveau ce cycle."
            exit 0
          fi
          git commit -m "Mise a jour automatique du screener -- setup ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # les jobs de simulation attendent ce push (needs: setup + checkout ref: master) pour
          # partir d'un cache/notes a jour -- pas de course a gerer ici, ce job est seul a ecrire
          # ces fichiers a ce stade du run.
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            echo "Push refuse (tentative $i/5), nouvelle tentative dans 10s..."
            sleep 10
          done
          echo "Echec du push apres 5 tentatives."
          exit 1

  # 2026-11-13 : geles (plus d etape CI, scripts et historique gardes) : A2-A8 (variantes aveugles
  # notes/secteur/Ollama, dont tout le job bots-ollama), B1 (bots-contraint), D1/D2/D4 (bots-delta).
  # Restent actifs ici : A1 (reference) et C1. Bilan : aucun filtre n ameliore A1, B1/D1 nettement negatifs.

  bots-aveugle:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Simulation de portefeuille en aveugle (Bot #1)
        run: python screener/simulate_portfolio.py

      - name: Commit + push si des resultats ont change
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/simulation/
          if git diff --cached --quiet; then
            echo "Rien de nouveau ce cycle."
            exit 0
          fi
          git commit -m "Mise a jour automatique du screener -- bots aveugle ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            echo "Push refuse (tentative $i/5), nouvelle tentative dans 10s..."
            sleep 10
          done
          echo "Echec du push apres 5 tentatives."
          exit 1

  bots-large:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Simulation de portefeuille large (equilibre par secteur, sans plafond) (Bot #3)
        run: python screener/simulate_large_portfolio.py

      - name: Commit + push si des resultats ont change
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/simulation/
          if git diff --cached --quiet; then
            echo "Rien de nouveau ce cycle."
            exit 0
          fi
          git commit -m "Mise a jour automatique du screener -- bots large ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            echo "Push refuse (tentative $i/5), nouvelle tentative dans 10s..."
            sleep 10
          done
          echo "Echec du push apres 5 tentatives."
          exit 1

  bots-strategies:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Strategie Qualite, notes seules (Bot #41)
        run: python screener/simulate_quality_portfolio.py

      - name: Strategie Valeur, decote seule (Bot #42)
        run: python screener/simulate_value_portfolio.py

      - name: Strategie Tendance, 8 ETF multi-actifs (Bot #43)
        run: python screener/simulate_trend_portfolio.py

      # Bot #44 (2026-10-12) : retour a la moyenne RSI(2) sur le S&P 500, decide pendant la derniere
      # heure de la seance US, execute a la cloture -- voir simulate_rsi2_portfolio.py.
      - name: Strategie Retour a la moyenne RSI2 (Bot #44)
        run: python screener/simulate_rsi2_portfolio.py

      # Bot #45 (2026-10-13) : achats d'inities sur petites capitalisations US, lus chaque matin dans
      # l'index quotidien EDGAR (~600 formulaires 4 par jour, ~3 min une fois par jour) -- voir
      # simulate_insider_portfolio.py et sec_form4.py.
      - name: Strategie Inities petites capitalisations (Bot #45)
        run: python screener/simulate_insider_portfolio.py

      # Bot #46 (2026-10-14) : sous-traitants de l'Etat federal dont le carnet de commandes publiques
      # (USAspending) grossit plus que prevu, revision mensuelle ; la mise a jour (~95 appels API) est
      # etalee sur plusieurs passages (40 par run) -- voir simulate_govcontracts_portfolio.py.
      - name: Strategie Commandes publiques (Bot #46)
        run: python screener/simulate_govcontracts_portfolio.py

      # Bot #47 (2026-10-14) : timing de marche sur les vues Wikipedia des pages des 30 societes du Dow
      # (Moat et al. 2013) ; decision hebdomadaire le premier jour de bourse, avant la cloture -- voir
      # simulate_wikiattention_portfolio.py.
      - name: Strategie Attention Wikipedia (Bot #47)
        run: python screener/simulate_wikiattention_portfolio.py

      # Bot #48 (2026-10-14) : copie des achats d'actions declares par les elus de la Chambre (index du
      # greffe rafraichi chaque jour, PDF lus avec PyMuPDF) ; traceur sans edge attendu -- voir
      # simulate_congress_portfolio.py.
      - name: Strategie Copie des elus (Bot #48)
        run: python screener/simulate_congress_portfolio.py

      # Bot #49 (2026-10-14) : ton anormal des communiques de resultats du S&P 500 (8-K 2.02, EX-99.1,
      # index EDGAR quotidien), Huang-Teoh-Zhang 2014 -- voir simulate_tone_portfolio.py et sec_daily.py.
      - name: Strategie Ton des communiques (Bot #49)
        run: python screener/simulate_tone_portfolio.py

      # Bot #50 (2026-10-14) : Lazy Prices -- 10-K et 10-Q presque inchanges d'une annee sur l'autre
      # (Cohen-Malloy-Nguyen 2020), 30 rapports compares par passage -- voir simulate_lazy_portfolio.py.
      - name: Strategie Rapports inchanges (Bot #50)
        run: python screener/simulate_lazy_portfolio.py

      # Bot #51 (2026-10-14) : meilleures idees des gerants actifs (jeux de donnees 13F trimestriels de la
      # SEC, ~100 Mo telecharges une fois par trimestre) -- voir simulate_bestideas_portfolio.py.
      - name: Strategie Meilleures idees des gerants (Bot #51)
        run: python screener/simulate_bestideas_portfolio.py

      - name: Commit + push si des resultats ont change
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/simulation/
          if git diff --cached --quiet; then
            echo "Rien de nouveau ce cycle."
            exit 0
          fi
          git commit -m "Mise a jour automatique du screener -- bots strategies ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            echo "Push refuse (tentative $i/5), nouvelle tentative dans 10s..."
            sleep 10
          done
          echo "Echec du push apres 5 tentatives."
          exit 1

  # Resume compact des courbes d'equity pour le dashboard (2026-10-06) : 31 derniers jours en
  # entier, 1 releve par jour au-dela -- voir screener/build_equity_summary.py. Les ~40 courbes
  # completes grossissent de ~29 lignes par jour et par bot et etaient retelechargees en entier
  # par le dashboard a chaque cycle. Apres TOUS les jobs de bots (chacun pousse ses propres
  # courbes) ; always() pour qu'un job de bots en echec ne fige pas le resume des autres. Seul
  # job a ecrire ce fichier, aucun appel reseau, bibliotheque standard uniquement.
  resume-courbes:
    needs: [bots-aveugle, bots-large, bots-strategies]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Portefeuille combine (2026-10-12) : melange virtuel a risque egal sous-evaluation (B1/C1/D1, C1 seul depuis le 2026-11-13) +
      # R1 + T1 + I1 (depuis le 2026-10-13), recalcule a chaque run depuis les courbes des bots -- voir build_combined_portfolio.py.
      # Avant le resume, qui reprend sa courbe comme celle des bots.
      - name: Construire le portefeuille combine
        run: pip install "pandas<3" && python screener/build_combined_portfolio.py && python screener/bilan_combined.py

      - name: Construire le resume des courbes
        run: python screener/build_equity_summary.py

      - name: Commit + push si le resume a change
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/simulation/equity_curves_summary.json
          git add results/simulation/combined_* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau ce cycle."
            exit 0
          fi
          git commit -m "Mise a jour automatique du screener -- resume des courbes ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin master && git push && exit 0
            echo "Push refuse (tentative $i/5), nouvelle tentative dans 10s..."
            sleep 10
          done
          echo "Echec du push apres 5 tentatives."
          exit 1
